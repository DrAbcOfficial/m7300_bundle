name: Build and publish deb release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.variant.name }}
    runs-on: ubuntu-24.04-arm
    # Ubuntu 24.04 (noble) dropped libwebkit2gtk-4.0. Build inside an
    # ubuntu:20.04 (focal) container so the GUI links against
    # libwebkit2gtk-4.0 and the glibc baseline is lowered to 2.31.
    container: ubuntu:20.04

    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: full (with airscan)
            suffix: ''
            escl: 'ON'
          - name: noairscan
            suffix: '-noairscan'
            escl: 'OFF'

    env:
      PACKAGE_NAME: pantum-m7300-bundle${{ matrix.variant.suffix }}
      ENABLE_ESCL: ${{ matrix.variant.escl }}
      # Avoid interactive prompts (e.g. tzdata) during apt-get in the container
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

    # Container jobs default to sh (dash); the scripts below use bashisms.
    defaults:
      run:
        shell: bash

    steps:
      - name: Install git (required by checkout)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates bash curl

      - name: Install modern CMake (focal ships 3.16, project requires >= 3.20)
        run: |
          CMAKE_VERSION=3.28.3
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-aarch64.tar.gz" \
            -o /tmp/cmake.tar.gz
          tar -xzf /tmp/cmake.tar.gz -C /opt
          ln -sf /opt/cmake-${CMAKE_VERSION}-linux-aarch64/bin/* /usr/local/bin/
          rm /tmp/cmake.tar.gz
          cmake --version

      - name: Check out source (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read version from VERSION file
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ -z "$VERSION" ]]; then
            echo "VERSION file is empty" >&2
            exit 1
          fi
          # For tag-triggered runs the tag must match the VERSION file,
          # which is the single source of truth for the package version.
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag '$GITHUB_REF_NAME' does not match VERSION file ('v$VERSION')." >&2
            echo "Update the VERSION file or push a matching tag." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: m7300_scan_gui/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: m7300_scan_gui/frontend/package-lock.json

      - name: Install build dependencies
        run: |
          apt-get update
          PKGS="build-essential g++-10 dpkg-dev pkg-config
            libcups2-dev libxml2-dev libjpeg-dev zlib1g-dev libpng-dev libsane-dev
            libgtk-3-dev libwebkit2gtk-4.0-dev"
          # shellcheck disable=SC2086
          apt-get install -y $PKGS
          if [[ "$ENABLE_ESCL" == "ON" ]]; then
            # focal has no sane-airscan package. CMake only checks for the
            # airscan-discover program via find_program (it is neither
            # compiled nor linked), so a stub satisfies the configure step.
            # The runtime dependency stays declared in the deb control file.
            install -m0755 /dev/null /usr/local/bin/airscan-discover
          fi

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build driver (pantum_m7300)
        run: |
          CC=gcc-10 CXX=g++-10 \
          cmake -S pantum_m7300 -B build/driver \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_PNG_SUPPORT=ON \
            -DENABLE_ESCL_SUPPORT="$ENABLE_ESCL"
          cmake --build build/driver --parallel

      - name: Install frontend dependencies
        run: npm ci
        working-directory: m7300_scan_gui/frontend

      - name: Build scan GUI (m7300_scan_gui)
        run: wails build -clean -platform linux/arm64
        working-directory: m7300_scan_gui

      - name: Assemble deb staging directory
        run: |
          set -euo pipefail
          STAGING="$GITHUB_WORKSPACE/staging"
          mkdir -p "$STAGING"

          # Driver: install into the staging directory
          DESTDIR="$STAGING" cmake --install build/driver

          # SANE backends: rename to libsane-* and create symlinks
          SANE_DIR="$(find "$STAGING/usr" -type d -name sane -print -quit)"
          if [[ -z "$SANE_DIR" ]]; then
            echo "Installed SANE backend directory was not found." >&2
            exit 1
          fi
          for backend in m7300fdn m7300fdw; do
            source_module="$SANE_DIR/sane-${backend}.so"
            target_module="libsane-${backend}.so.1.0.32"
            if [[ ! -f "$source_module" ]]; then
              echo "Installed module is missing: $source_module" >&2
              exit 1
            fi
            mv "$source_module" "$SANE_DIR/$target_module"
            ln -s "$target_module" "$SANE_DIR/libsane-${backend}.so.1"
            ln -s "$target_module" "$SANE_DIR/libsane-${backend}.so"
          done

          # Scan GUI: binary / icon / desktop entry
          GUI_BIN="m7300_scan_gui/build/bin/pantum-scan-gui"
          if [[ ! -x "$GUI_BIN" ]]; then
            echo "GUI binary not found: $GUI_BIN" >&2
            exit 1
          fi
          install -Dm0755 "$GUI_BIN" "$STAGING/usr/bin/pantum-scan-gui"
          install -Dm0644 m7300_scan_gui/build/appicon.png \
            "$STAGING/usr/share/pantum-scan-gui/pantum-scan-gui.png"
          install -d "$STAGING/usr/share/applications"
          cat > "$STAGING/usr/share/applications/pantum-scan-gui.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Pantum Scanner
          Name[zh_CN]=奔图扫描工具
          Comment=Scan with M7300FDN / M7300FDW
          Comment[zh_CN]=M7300FDN / M7300FDW 扫描
          Exec=/usr/bin/pantum-scan-gui
          Icon=/usr/share/pantum-scan-gui/pantum-scan-gui.png
          Terminal=false
          Categories=Graphics;Scanning;
          EOF

      - name: Write deb metadata and build package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          STAGING="$GITHUB_WORKSPACE/staging"
          ARCHITECTURE="$(dpkg --print-architecture)"
          DEBIAN_DIR="$STAGING/DEBIAN"
          mkdir -p "$DEBIAN_DIR"
          chmod 755 "$STAGING"

          DEPENDS='libc6 (>= 2.31), libcups2, libsane1, libjpeg-turbo8 | libjpeg62-turbo, libpng16-16, zlib1g, libxml2, libgtk-3-0, libwebkit2gtk-4.0-37 | libwebkit2gtk-4.1-0'
          if [[ "$ENABLE_ESCL" == "ON" ]]; then
            DEPENDS="$DEPENDS, sane-airscan"
          fi

          printf '%s\n' \
            "Package: ${PACKAGE_NAME}" \
            "Version: ${VERSION}" \
            "Section: graphics" \
            "Priority: optional" \
            "Architecture: ${ARCHITECTURE}" \
            'Maintainer: Pantum Linux Driver Maintainers <drivers@example.invalid>' \
            "Depends: ${DEPENDS}" \
            'Description: Pantum M7300FDN/M7300FDW drivers and scanner GUI bundle' \
            ' CUPS PostScript filters, PPDs, SANE WSD backends, scan utilities,' \
            ' and the pantum-scan-gui desktop application.' \
            > "$DEBIAN_DIR/control"

          printf '%s\n' \
            '/etc/sane.d/m7300fdn.conf' \
            '/etc/sane.d/m7300fdw.conf' \
            > "$DEBIAN_DIR/conffiles"

          printf '%s\n' \
            '#!/bin/sh' \
            'set -e' \
            'for backend in m7300fdn m7300fdw; do' \
            '    if [ -f /etc/sane.d/dll.conf ] && ! grep -qx "$backend" /etc/sane.d/dll.conf; then' \
            '        printf "%s\\n" "$backend" >> /etc/sane.d/dll.conf' \
            '    fi' \
            'done' \
            > "$DEBIAN_DIR/postinst"
          chmod 755 "$DEBIAN_DIR/postinst"

          mkdir -p dist
          PACKAGE_PATH="dist/${PACKAGE_NAME}_${VERSION}_${ARCHITECTURE}.deb"
          dpkg-deb --root-owner-group --build "$STAGING" "$PACKAGE_PATH"
          (cd dist && sha256sum "$(basename "$PACKAGE_PATH")" > "$(basename "$PACKAGE_PATH").sha256")
          echo "Package created: $PACKAGE_PATH"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb${{ matrix.variant.suffix }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read version from VERSION file
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ -z "$VERSION" ]]; then
            echo "VERSION file is empty" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag '$GITHUB_REF_NAME' does not match VERSION file ('v$VERSION')." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: deb*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            TARGET_ARGS=()
            if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
              TARGET_ARGS=(--target "$GITHUB_SHA")
            fi
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              "${TARGET_ARGS[@]}"
          fi

          gh release upload "$TAG" dist/*.deb dist/*.sha256 --clobber
          echo "Published to release $TAG:"
          ls -l dist/
